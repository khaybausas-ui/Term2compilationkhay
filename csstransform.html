<!DOCTYPE html>
<html>
<head>
<title>The CSS Box Shadow And Transformation</title>
<style>
  body{
    background: #C4A887;
    font-family: Arial, sans-serif;
  }
  .box{
    width: 300px;
    height: 200px;
    margin: 50px auto;
    box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
    transform: rotate(10deg) scale(1.1);
    transition: transform 0.3s ease-in-out;
    overflow: hidden; /* Keeps the image inside the box */
  }
  .box img{
    width: 100%;
    height: 100%;
    object-fit: cover; /* Ensures the image fills the box nicely */
  }
  .box:hover{
    transform: rotate(-10deg) scale(1.2);
  }
</style>
</head>
<body>

<br><br>
<div class="box">
  <img src="I.jpg" alt="Sample Image">
</div>
<br>

<marquee direction="right" behavior="alternate" scrollamount="10" bgcolor="#D8D0C7" height="80">
  <h1 style="text-align: center;">What's up i'm Khayley Ainsley C. Bausas</h1>
</marquee>

</body>
</html>
